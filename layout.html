<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
        <title>gym layout</title>
</head>
<body>
        <!-- EXERCISE 1: Nine Positions -->
    <section class="max-w-6xl mx-auto mb-16 bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-2xl font-bold mb-2"> Positions cards</h2>
      

      <!-- Grid of 9 containers -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- 1. Top Left -->
        <div>
         
          <div class="flex justify-start items-start h-64 border-2 border border-slate-300 rounded-lg bg-slate-50 p-2">
            <div class="w-78 h-60 bg-red-500 rounded-md shadow flex items-center justify-center text-white font-bold">1</div>
          </div>
        </div>

        <!-- 2. Top Center -->
        <div>

          <div class="flex justify-center items-start h-64 border-2 border border-slate-300 rounded-lg bg-slate-50 p-2">
            <div class="w-78 h-60 bg-orange-500 rounded-md shadow flex items-center justify-center text-white font-bold">2</div>
          </div>
        </div>

        <!-- 3. Top Right -->
        <div>
          
          <div class="flex justify-end items-start h-64 border-2 border border-slate-300 rounded-lg bg-slate-50 p-2">
            <div class="w-78 h-60 bg-amber-500 rounded-md shadow flex items-center justify-center text-white font-bold">3</div>
          </div>
        </div>

        <!-- 4. Center Left -->
        <div>
          
          <div class="flex justify-start items-center h-64 border-2 border-dashed border-slate-300 rounded-lg bg-slate-50 p-2">
            <div class="w-78 h-60 bg-green-500 rounded-md shadow flex items-center justify-center text-white font-bold">4</div>
          </div>
        </div>

        <!-- 5. Center -->
        <div>
         
          <div class="flex justify-center items-center h-64 border-2 border-dashed border-slate-300 rounded-lg bg-slate-50 p-2">
            <div class="w-78 h-60 bg-emerald-500 rounded-md shadow flex items-center justify-center text-white font-bold">5</div>
          </div>
        </div>

        <!-- 6. Center Right -->
        <div>
          
          <div class="flex justify-end items-center h-64 border-2 border-dashed border-slate-300 rounded-lg bg-slate-50 p-2">
            <div class="w-78 h-60 bg-teal-500 rounded-md shadow flex items-center justify-center text-white font-bold">6</div>
          </div>
        </div>

        <!-- 7. Bottom Left -->
        <div>
          
          <div class="flex justify-start items-end h-64 border-2 border-dashed border-slate-300 rounded-lg bg-slate-50 p-2">
            <div class="w-78 h-60 bg-blue-500 rounded-md shadow flex items-center justify-center text-white font-bold">7</div>
          </div>
        </div>

        <!-- 8. Bottom Center -->
        <div>
         
          <div class="flex justify-center items-end h-64 border-2 border-dashed border-slate-300 rounded-lg bg-slate-50 p-2">
            <div class="w-78 h-60 bg-indigo-500 rounded-md shadow flex items-center justify-center text-white font-bold">8</div>
          </div>
        </div>

        <!-- 9. Bottom Right -->
        <div>
          
          <div class="flex justify-end items-end h-64 border-2 border-dashed border-slate-300 rounded-lg bg-slate-50 p-2">
            <div class="w-78 h-60 bg-purple-500 rounded-md shadow flex items-center justify-center text-white font-bold">9</div>
          </div>
        </div>

      </div>
    </section>
    
    <section class="max-w-6xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
      
      
      
      <nav class="flex items-center justify-between bg-slate-50 border border-slate-200 px-6 py-4 rounded-xl shadow-sm">
        
        
        <a href="#" class="text-xl font-extrabold tracking-tight text-slate-900">
          <span class="text-blue-600">Logo</span>
        </a>

        
        <div class="hidden md:flex items-center gap-8">
          <a href="#" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition-colors">Home</a>
          <a href="#" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition-colors">About</a>
          <a href="#" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition-colors">Services</a>
          <a href="#" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition-colors">Contact</a>
        </div>

        <!-- 3. Button Right (with hover and focus-visible) -->
        <div>
          <button class="bg-blue-600 text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition-all hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
            Sign up
          </button>
        </div>

      </nav>
    </section>
</body>
</html>
